<!DOCTYPE html><html><head><meta charset="utf-8"><title>{{ .Site.Title }}</title><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6;}h1{border-bottom:2px solid #333;padding-bottom:10px;}.post-link{font-size:1.2rem;font-weight:bold;color:#0066cc;}</style></head><body><h1>{{ .Site.Title }}</h1><h2>最新文章列表：</h2><ul>{{ range where .Site.RegularPages "Section" "posts" }}<li><a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a> - <small>{{ .Date.Format "2006-01-02" }}</small></li>{{ else }}<li>目前還沒有文章</li>{{ end }}</ul></body></html>
